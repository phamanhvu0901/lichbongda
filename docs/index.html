<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lịch thi đấu bóng đá – Giờ Việt Nam</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23fff' stroke='%23111' stroke-width='3'/%3E%3Cpolygon points='32,20 43,28 39,41 25,41 21,28' fill='%23111'/%3E%3Cpath d='M32 20V4M43 28l15-6M39 41l9 13M25 41l-9 13M21 28L6 22' stroke='%23111' stroke-width='3' fill='none'/%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0a0d0c;--card:#141a17;--ink:#f2f7f4;--mute:#a9bab0;--line:#26332c;
  --accent:#ccff00;--accent-ink:#0a0d0c;--accent-soft:#232d12;--live:#ff6b70;--shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
header{background:linear-gradient(180deg,#17211b,#0a0d0c);padding:24px 16px 8px}
.wrap{max-width:1068px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.01em}
.clock{text-align:right;font-variant-numeric:tabular-nums}
.clock b{display:block;font-size:24px;line-height:1.1;color:var(--accent)}
.clock span{font-size:13px;opacity:.9}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
aside{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:720px){aside{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.panel h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.row-actions{display:flex;gap:10px;margin-top:8px;font-size:13px}
.link{background:none;border:0;color:var(--accent);padding:0;text-decoration:underline}
input[type=search]{width:100%;min-height:44px;padding:9px 18px;border:2px solid var(--accent);border-radius:22px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px}
input[type=search]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.crest{position:relative}
.crest img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0}
.crest.has-logo{background:#fff!important;box-shadow:none!important;font-size:0}
.crest.has-logo img{inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);opacity:1}
.clubs{max-height:260px;overflow:auto;margin:0 -6px;padding:0 6px}
.clubs h3{font-size:12px;color:var(--mute);margin:10px 0 4px;font-weight:600}
.club{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:6px 4px;border-radius:8px}
.club:hover{background:var(--accent-soft)}
.club .star{margin-left:auto;font-size:18px;color:var(--mute)}
.club[aria-pressed=true] .star{color:var(--accent)}
.club[aria-pressed=true]{font-weight:600}
.crest{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:8px 14px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.next-title{margin:0 0 14px;font-size:20px;color:var(--accent)}
.next-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px;margin-bottom:28px}
.next{display:flex;flex-direction:column;gap:12px;min-height:280px;padding:24px;border-radius:24px;color:var(--t);background:linear-gradient(150deg,var(--g1) 0%,var(--gm) 45%,var(--g2) 100%);box-shadow:0 12px 32px var(--glow)}
.next .who{font-size:24px;font-weight:800;display:flex;align-items:center;gap:10px}
.next .who .crest{outline:2px solid var(--t);outline-offset:2px}
.next .vs{font-size:16px;font-weight:600}
.next .kick{font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.next .when{font-size:14px}
.next .cd{align-self:flex-start;background:var(--chip);font-weight:700;border-radius:999px;padding:4px 12px;font-size:13px}
.next .go{margin-top:auto;min-height:44px;border:0;border-radius:22px;background:var(--t);color:var(--btn);font-weight:600}
.next .go:focus-visible{outline:3px solid var(--t);outline-offset:3px}
.day{margin:18px 0 6px;font-weight:700;font-size:14px;color:var(--mute);text-transform:capitalize}
.match{display:grid;grid-template-columns:70px 1fr 74px 1fr;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.match .t{font-weight:700;font-variant-numeric:tabular-nums}
.match .t small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.team{display:flex;align-items:center;gap:8px;min-width:0}
.team span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team.a{justify-content:flex-start}
.team.h{justify-content:flex-end;text-align:right;flex-direction:row-reverse}
.score{text-align:center;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.score.vs{font-weight:500;font-size:13px;color:var(--mute)}
.lg{grid-column:1/-1;font-size:12px;color:var(--mute);margin-top:-2px}
.fav-row{box-shadow:inset 3px 0 0 var(--accent)}
.live{color:var(--live);font-size:12px;font-weight:700}
.match{cursor:pointer;transition:border-color .15s,transform .15s}
.match:hover,.match:focus-visible{border-color:var(--accent);outline:none;transform:translateY(-1px)}
.match .hint{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:-2px}
.match .hint b{color:var(--accent);font-weight:600}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;z-index:50}
.ov.on{display:flex}
.modal{background:var(--card);color:var(--ink);border-radius:16px;max-width:720px;width:100%;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.mh{background:linear-gradient(150deg,#26382d,#0f1512);color:#fff;padding:16px 18px;position:relative}
.mh .x{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.2);border:0;color:#fff;width:32px;height:32px;border-radius:50%;font-size:18px}
.mh .lgn{font-size:12px;opacity:.9;margin-bottom:6px}
.mh .teams{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.mh .teams b{font-size:17px}
.mh .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.mh .sub{margin-top:6px;text-align:center;font-size:13px;opacity:.95}
.mb{padding:14px 18px 18px}
.mb h4{margin:16px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.mb h4:first-child{margin-top:0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols .ct{font-weight:700;margin-bottom:6px;font-size:14px}
.pl{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.pl i{font-style:normal;flex:none;width:28px;text-align:center;font-size:10px;font-weight:700;border-radius:6px;padding:2px 0;background:var(--accent-soft);color:var(--accent)}
.pl.sub{color:var(--mute)}
.st{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-size:13px;margin:7px 0;text-align:center}
.st .l{text-align:left;font-weight:700;font-variant-numeric:tabular-nums}
.st .r{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.st .n{color:var(--mute)}
.seg.mini{display:flex;width:max-content;margin:0 auto 10px;font-size:13px}
.seg.mini button{padding:5px 14px}
.pitch{max-width:460px;margin:0 auto;border-radius:14px;overflow:hidden;background:#0a0e13;color:#fff}
.tbar{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:13px}
.tbar b{font-size:14px}
.tbar .fm{opacity:.85;font-variant-numeric:tabular-nums}
.tbar .mg{margin-left:auto;opacity:.85;text-align:right}
.field{position:relative;background:repeating-linear-gradient(180deg,#171e27 0 40px,#131a22 40px 80px)}
.field i{position:absolute;border:1.5px solid rgba(255,255,255,.13);pointer-events:none}
.field .mid{left:0;right:0;top:50%;border-width:1.5px 0 0}
.field .circle{width:96px;height:96px;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.field .box{left:22%;right:22%;height:11%}
.field .box.top{top:-2px}
.field .box.bot{bottom:-2px}
.half{position:relative;display:flex;flex-direction:column;justify-content:space-around;min-height:390px;padding:10px 2px}
.line{display:flex;justify-content:space-evenly;align-items:flex-start;padding:3px 0}
.pp{flex:1 1 0;max-width:96px;min-width:0;text-align:center}
.pp .av{position:relative;width:40px;height:40px;margin:0 auto 3px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--c);color:var(--t);border:3px solid var(--c2);box-shadow:0 0 0 1px rgba(255,255,255,.4)}
.tbar .shirt{flex:none;width:21px;height:19px;fill:var(--c);stroke:rgba(255,255,255,.75);stroke-width:1.2;stroke-linejoin:round}
.pp .av img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}
.pp .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;font-size:11px;line-height:1.25;padding:0 2px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.rt{display:inline-block;min-width:28px;padding:1px 5px;border-radius:999px;font-style:normal;font-size:11px;font-weight:800;line-height:1.4;color:#fff;text-align:center;font-variant-numeric:tabular-nums}
.pp .av .rt{position:absolute;z-index:1;top:-7px;right:22px}
.r1{background:#d9363e}.r2{background:#d9701a}.r3{background:#a98200}.r4{background:#238b45}.r5{background:#2569c9}
.ev{position:absolute;z-index:1;display:flex;gap:2px;left:27px;white-space:nowrap}
.ev.up{top:-7px}
.ev.dn{bottom:1px}
.ev span{display:grid;place-items:center;min-width:15px;height:15px;padding:0 2px;border-radius:8px;background:#fff;color:#12261b;font-size:9px;font-weight:800;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.ev .yc,.ev .rc{min-width:10px;width:10px;border-radius:2px;background:#f7cf1d}
.ev .rc{background:#e5383b}
.ev .off{color:#d9363e;font-size:11px}
.pend{background:var(--accent-soft);border-radius:12px;padding:14px;font-size:14px}
@media (max-width:560px){.cols{grid-template-columns:1fr}}
.empty{padding:28px;text-align:center;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:14px}
.note{font-size:12px;color:var(--mute);margin:20px 0 4px}
@media (max-width:520px){
  .match{grid-template-columns:56px 1fr 56px 1fr;padding:8px}
  .team{flex-direction:column;align-items:center;text-align:center;gap:2px;font-size:13px}
  .team.h{flex-direction:column}
  .team span:last-child{white-space:normal}
}
@media (max-width:560px){.clock{text-align:left}}
/* Font khối "Tìm câu lạc bộ" – đổi tên font tại đây */
.search-panel,.search-panel h2{font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div>
      <h1>⚽ Lịch thi đấu bóng đá</h1>
      <div style="opacity:.9;font-size:14px">Toàn bộ giờ hiển thị theo múi giờ Việt Nam (GMT+7)</div>
    </div>
    <div class="clock"><b id="clockTime">--:--:--</b><span id="clockDate"></span></div>
  </div>
</header>

<main>
  <aside>
    <div class="panel search-panel">
      <h2>Tìm câu lạc bộ</h2>
      <input type="search" id="clubSearch" placeholder="Nhập tên CLB, ví dụ: Arsenal…" aria-label="Tìm câu lạc bộ" autocomplete="off">
      <div class="clubs" id="clubList"></div>
    </div>
    <div class="panel">
      <h2>CLB bạn theo dõi</h2>
      <div id="favList"></div>
      <div class="row-actions" id="clearRow"><button class="link" id="clearFav">Xóa tất cả</button></div>
    </div>
  </aside>

  <section>
    <div id="nextWrap"></div>
    <div class="bar">
      <div class="seg" role="group" aria-label="Loại trận">
        <button data-tab="day" aria-pressed="true">Hôm nay</button>
        <button data-tab="up" aria-pressed="false">Sắp diễn ra</button>
        <button data-tab="res" aria-pressed="false">Kết quả</button>
      </div>
    </div>
    <div id="list"></div>
    <p class="note" id="stamp"></p>
  </section>
</main>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="Chi tiết trận đấu"><div class="modal" id="modal"></div></div>

const M=RAW.trim().split('\n').map((l,i)=>{const [lg,h,a,iso,hs,as]=l.split('|');return{i,lg,h:nm(h),a:nm(a),t:Date.parse(iso+':00Z'),hs:hs===''?null:+hs,as:as===''?null:+as}});

// ---- Định dạng giờ Việt Nam
const fDate=new Intl.DateTimeFormat('vi-VN',{timeZone:TZ,weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
const fTime=new Intl.DateTimeFormat('vi-VN',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
const fSec=new Intl.DateTimeFormat('vi-VN',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
const fKey=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
const MATCH_MS=115*60000;

// ---- Trạng thái
const clubs=new Map(); // tên -> Set giải
M.forEach(m=>[m.h,m.a].forEach(c=>{if(!clubs.has(c))clubs.set(c,new Set());clubs.get(c).add(m.lg)}));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const S={fav:new Set(load('fav',[]).filter(c=>clubs.has(c))),tab:'day',q:''};
const persist=()=>save('fav',[...S.fav]);

// ---- Tiện ích
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Logo CLB: chỉ thêm file bạn được phép dùng. Dạng 'Tên CLB đúng như trong trang':'đường dẫn ảnh'
// Ví dụ: 'Arsenal':'logos/arsenal.png', 'Hà Nội':'logos/ha-noi.png'
const LOGOS={
};
function crest(n){const ini=n.replace(/^\d+\.\s*/,'').split(/\s+/).map(w=>w[0]).join('').slice(0,3).toUpperCase(),[c,c2]=CLUB_COLORS[n]||['#4a5a52','#ffffff'];const img=LOGOS[n]?`<img src="${esc(LOGOS[n])}" alt="" onload="this.parentNode.classList.add('has-logo')" onerror="this.remove()">`:'';return `<span class="crest" style="background:${c};color:${inkOn(c)};box-shadow:0 0 0 1.5px ${c2}">${esc(ini)}${img}</span>`}
const isOver=(m,now)=>now>=m.t+MATCH_MS;
const isLive=(m,now)=>m.hs===null&&m.t<=now&&!isOver(m,now);
const isUpcoming=(m,now)=>m.hs===null&&!isOver(m,now);
function countdown(t,now){
  const d=t-now; if(d<=0)return 'Đang diễn ra';
  const days=Math.floor(d/864e5),h=Math.floor(d%864e5/36e5),mi=Math.floor(d%36e5/6e4);
  if(days>0)return `Còn ${days} ngày ${h} giờ`;
  if(h>0)return `Còn ${h} giờ ${mi} phút`;
  return `Còn ${mi} phút`;
}

// Ngày hiển thị ở tab đầu: hôm nay; nếu không có trận thì ngày sắp tới gần nhất, hết lịch thì ngày gần nhất đã qua
function focusDay(now){
  const today=fKey.format(now),days=[...new Set(M.map(m=>fKey.format(m.t)))].sort();
  return {today,day:days.find(d=>d>=today)||days[days.length-1]};
}

// ---- Vẽ giao diện
// Gradient của thẻ theo màu áo: áo sáng dùng chữ đậm, áo còn lại được làm đậm đủ để đọc chữ trắng
const mix=(a,b,k)=>{const x=rgb(a),y=rgb(b);return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*k).toString(16).padStart(2,'0')).join('')};
const lum=h=>{const [r,g,b]=rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*r+.7152*g+.0722*b};
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
function cardTheme(c){
  let g1=(CLUB_COLORS[c]||['#1c2c5b'])[0];
  const light=contrast(g1,'#0a0d0c')>=7;
  if(!light)while(contrast(g1,'#ffffff')<4.5)g1=mix(g1,'#000000',.05);
  const gm=mix(g1,'#000000',light?.07:.3),g2=mix(g1,'#000000',light?.15:.75);
  const glow=!light&&lum(g1)<.03?'rgba(255,255,255,.14)':`rgba(${rgb(g1).join(',')},.4)`;
  return {g1,gm,g2,glow,t:light?'#0a0d0c':'#ffffff',btn:light?'#ffffff':g1,chip:light?'rgba(255,255,255,.45)':'rgba(0,0,0,.3)'};
}
const cardStyle=c=>Object.entries(cardTheme(c)).map(([k,v])=>`--${k}:${v}`).join(';');
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').toLowerCase();
const clubBtn=c=>`<button class="club" data-club="${esc(c)}" aria-pressed="${S.fav.has(c)}">${crest(c)}<span>${esc(c)}</span><span class="star">${S.fav.has(c)?'★':'☆'}</span></button>`;
function drawClubs(){
  const q=norm(S.q.trim());
  if(!q){clubList.innerHTML='<div style="color:var(--mute);font-size:13px">Gõ tên câu lạc bộ (V.League 1, Ngoại hạng Anh, La Liga, Serie A, Bundesliga, Ligue 1, Champions League, AFC Champions League Elite) rồi bấm ngôi sao để theo dõi.</div>';}
  else{
    const r=[...clubs.keys()].filter(c=>norm(c).includes(q)).sort();
    clubList.innerHTML=r.length?r.map(clubBtn).join(''):'<div style="color:var(--mute);font-size:13px">Không tìm thấy CLB phù hợp.</div>';
  }
  const f=[...S.fav].sort();
  favList.innerHTML=f.length?f.map(clubBtn).join(''):'<div style="color:var(--mute);font-size:13px">Chưa có CLB nào.</div>';
  clearRow.style.display=f.length?'flex':'none';
}
function drawNext(){
  const now=Date.now();
  if(!S.fav.size){nextWrap.innerHTML=`<div class="empty" style="margin-bottom:18px">☆ Hãy tìm câu lạc bộ bạn yêu thích bằng ô tìm kiếm và bấm ngôi sao để xem <b>lịch thi đấu</b> và <b>trận tiếp theo</b> của đội đó.</div>`;return}
  const cards=[...S.fav].sort().map(c=>{
    const n=M.filter(m=>(m.h===c||m.a===c)&&isUpcoming(m,now)).sort((a,b)=>a.t-b.t)[0];
    if(!n)return `<div class="next" style="${cardStyle(c)}"><div class="who">${crest(c)}${esc(c)}</div><div class="when">Chưa có lịch trận tiếp theo trong dữ liệu.</div></div>`;
    const home=n.h===c,opp=home?n.a:n.h;
    return `<div class="next" style="${cardStyle(c)}"><div class="who">${crest(c)}${esc(c)}</div>
      <div class="vs">${home?'Sân nhà gặp':'Sân khách gặp'} ${esc(opp)}</div>
      <div class="kick">${fTime.format(n.t)}</div>
      <div class="when">${LG[n.lg]}<br>${fDate.format(n.t)} (GMT+7)</div>
      <span class="cd" data-cd="${n.t}">${countdown(n.t,now)}</span>
      <button class="go" data-open="${n.i}">Chi tiết trận</button></div>`;
  }).join('');
  nextWrap.innerHTML=`<h2 class="next-title">Trận tiếp theo của CLB yêu thích</h2><div class="next-grid">${cards}</div>`;
}
function drawList(){
  const now=Date.now();
  const byDay=S.tab==='day',up=S.tab==='up',{today,day}=focusDay(now);
  const label=document.querySelector('[data-tab="day"]');
  label.textContent=day===today?'Hôm nay':'Ngày gần nhất';
  if(!byDay&&!S.fav.size){list.innerHTML='';return}
  // Tab theo ngày hiện mọi trận; hai tab còn lại chỉ hiện CLB đang theo dõi
  const ms=byDay?M.filter(m=>fKey.format(m.t)===day)
    :M.filter(m=>(S.fav.has(m.h)||S.fav.has(m.a))&&isUpcoming(m,now)===up);
  ms.sort((a,b)=>byDay||up?a.t-b.t:b.t-a.t);
  if(!ms.length){list.innerHTML=`<div class="empty">Không có trận ${up?'sắp diễn ra':'đã có kết quả'} theo bộ lọc hiện tại.</div>`;return}
  let out=byDay&&day!==today?'<div class="empty" style="padding:14px">Hôm nay không có trận. Đang hiện ngày có trận gần nhất.</div>':'',last='';
  for(const m of ms){
    const k=fKey.format(m.t);
    if(k!==last){out+=`<div class="day">${fDate.format(m.t)}</div>`;last=k}
    const fav=S.fav.has(m.h)||S.fav.has(m.a);
    const live=isLive(m,now);
    const mid=m.hs!==null?`${m.hs} - ${m.as}`:live?'<span class="live">● ĐANG ĐÁ</span>':isOver(m,now)?'Chờ kết quả':'vs';
    out+=`<div class="match ${fav?'fav-row':''}" data-i="${m.i}" role="button" tabindex="0" aria-label="Xem chi tiết ${esc(m.h)} gặp ${esc(m.a)}"><div class="t">${fTime.format(m.t)}<small>GMT+7</small></div>
      <div class="team h"><span>${esc(m.h)}</span>${crest(m.h)}</div>
      <div class="score ${m.hs===null&&!live?'vs':''}">${mid}</div>
      <div class="team a">${crest(m.a)}<span>${esc(m.a)}</span></div>
      <div class="hint"><span>${LG[m.lg]}</span><b>${LINEUPS[m.h+'|'+m.a]?'Xem đội hình ›':'Chi tiết ›'}</b></div></div>`;
  }
  list.innerHTML=out;
}
function drawAll(){drawClubs();drawNext();drawList()}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.open){openMatch(+b.dataset.open)}
  else if(b.dataset.club){const c=b.dataset.club;S.fav.has(c)?S.fav.delete(c):S.fav.add(c);persist();drawClubs();drawNext();drawList()}
  else if(b.dataset.tab){S.tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-pressed',x===b));drawList()}
  else if(b.id==='clearFav'){S.fav=new Set();persist();drawAll()}
});
// ---- Chi tiết trận: đội hình ra sân, dự bị, thống kê
const POS={goalkeeper:['TM',0],defender:['HV',1],midfielder:['TV',2],forward:['TĐ',3]};
function parsePlayer(s){
  const mt=s.match(/^(.*?)\s*\(([^)]*)\)$/);const raw=mt?mt[1]:s,pos=mt?mt[2]:'';
  const parts=raw.split(', ');const name=parts.length>1?parts[1]+' '+parts[0]:raw;
  const p=POS[pos]||['',9];return{name,tag:p[0],rank:p[1]};
}
const plRow=(p,cls)=>`<div class="pl ${cls||''}"><i>${p.tag||'–'}</i><span>${esc(p.name)}</span></div>`;
function teamCol(title,arr){
  const all=arr.map(parsePlayer);
  const st=all.slice(0,11).sort((a,b)=>a.rank-b.rank),bn=all.slice(11);
  return {st:`<div><div class="ct">${esc(title)}</div>${st.map(p=>plRow(p)).join('')}</div>`,
          bn:`<div><div class="ct">${esc(title)}</div>${bn.map(p=>plRow(p,'sub')).join('')}</div>`};
}

const rgb=h=>{h=h.slice(1);if(h.length===3)h=h.replace(/./g,'$&$&');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
// khoảng cách màu (công thức redmean): càng nhỏ càng giống nhau
const colorGap=(a,b)=>{const [r,g,bl]=rgb(a),[R,G,B]=rgb(b),m=(r+R)/2;return Math.sqrt((2+m/256)*(r-R)**2+4*(g-G)**2+(2+(255-m)/256)*(bl-B)**2)};
const inkOn=c=>{const [r,g,b]=rgb(c);return .299*r+.587*g+.114*b>150?'#12161c':'#ffffff'};
const SIMILAR=190;
function matchKits(m,L){
  const home=L.kh||CLUB_COLORS[m.h]||['#ffffff','#1c2c5b'];
  let away=L.ka||CLUB_COLORS[m.a]||['#1c2c5b','#ffffff'];
  // Hai đội trùng màu: đội khách dùng màu phụ, nếu vẫn trùng thì chọn màu dự phòng khác nhất
  if(!L.ka&&colorGap(home[0],away[0])<SIMILAR){
    const alt=[away[1],'#ffffff','#1c2c5b','#f5b731'].find(c=>colorGap(home[0],c)>=SIMILAR);
    away=[alt,away[0]];
  }
  const gk=['#f5b731','#2ee6a6','#b06cf0','#ff7ab6','#9aa4b2'].filter(c=>colorGap(c,home[0])>=SIMILAR&&colorGap(c,away[0])>=SIMILAR);
  const kit=([c,c2],g)=>({c,c2,gk:g});
  return [kit(home,gk[0]||'#9aa4b2'),kit(away,gk[1]||gk[0]||'#9aa4b2')];
}
const kitStyle=(c,c2)=>esc(`--c:${c};--c2:${c2};--t:${inkOn(c)}`);
let lineupView=load('lineupView','pitch')==='list'?'list':'pitch';
const shortName=(raw,all)=>{
  const base=x=>x.replace(/\s*\([^)]*\)$/,'');
  const [last,first]=base(raw).split(', ');
  const twin=first&&all.filter(x=>base(x).split(', ')[0]===last).length>1;
  return twin?first[0]+'. '+last:last;
};
function buildRows(arr,form){
  const st=arr.slice(0,11).map(raw=>({...parsePlayer(raw),raw}));
  if(st.length<11)return null;
  if(form){
    const n=form.split('-').map(Number);
    if(n.every(x=>x>0)&&n.reduce((a,b)=>a+b,0)===10){let k=0;return [1,...n].map(c=>st.slice(k,k+=c))}
  }
  // Chưa khai báo sơ đồ: xếp theo nhóm vị trí. Thiếu vị trí thì không đoán.
  if(st.some(p=>!p.tag)||st.filter(p=>p.tag==='TM').length!==1)return null;
  const rows=[];
  for(const tag of ['TM','HV','TV','TĐ']){
    const g=st.filter(p=>p.tag===tag);
    if(g.length>5){const half=Math.floor(g.length/2);rows.push(g.slice(0,half),g.slice(half))}
    else if(g.length)rows.push(g);
  }
  return rows;
}
const rtClass=r=>r<6?'r1':r<6.5?'r2':r<7?'r3':r<8?'r4':'r5';
const rtBadge=r=>typeof r==='number'?`<em class="rt ${rtClass(r)}">${r.toFixed(1)}</em>`:'';
function playerDot(p,info,all,kit,isGk){
  const x=info[p.name]||{},label=shortName(p.raw,all);
  const initials=p.name.split(' ').filter(Boolean).map(w=>w[0]).filter((c,i,a)=>i===0||i===a.length-1).join('').toUpperCase();
  const ic=(on,cls,txt,title,count)=>on?`<span class="${cls}" title="${title}">${txt}${count>1?'×'+count:''}</span>`:'';
  const up=ic(x.out,'off','⇄','Bị thay ra')+ic(x.y,'yc','','Thẻ vàng')+ic(x.red,'rc','','Thẻ đỏ');
  const dn=ic(x.g,'','⚽','Bàn thắng',x.g)+ic(x.as,'','A','Kiến tạo',x.as);
  const style=isGk?kitStyle(kit.gk,'#ffffff'):kitStyle(kit.c,kit.c2);
  return `<div class="pp" title="${esc(p.name)}"><div class="av" style="${style}">${x.n??esc(initials)}${x.img?`<img src="${esc(x.img)}" alt="" onerror="this.remove()">`:''}${rtBadge(x.r)}${up?`<span class="ev up">${up}</span>`:''}${dn?`<span class="ev dn">${dn}</span>`:''}</div><span class="nm">${x.c?'(C) ':''}${x.img&&x.n!=null?x.n+' ':''}${esc(label)}</span></div>`;
}
function teamBar(name,form,coach,rows,info,kit){
  const rs=rows.flat().map(p=>(info[p.name]||{}).r).filter(r=>typeof r==='number');
  const avg=rs.length?Math.round(rs.reduce((a,b)=>a+b,0)/rs.length*100)/100:null;
  return `<div class="tbar">${avg===null?'':`<em class="rt ${rtClass(avg)}">${avg.toFixed(2)}</em>`}<svg class="shirt" viewBox="0 0 22 20" style="${kitStyle(kit.c,kit.c2)}" aria-hidden="true"><path d="M7 1.5h1.5q2.5 2.5 5 0H15l6 4-2.5 4.5-2-1v9.5h-11V9l-2 1L1 5.500z"/></svg><b>${esc(name)}</b>${form?`<span class="fm">${esc(form)}</span>`:''}${coach?`<span class="mg">HLV ${esc(coach)}</span>`:''}</div>`;
}
function pitchView(m,L){
  const hr=buildRows(L.h,L.fh),ar=buildRows(L.a,L.fa);
  if(!hr||!ar)return '';
  const [kh,ka]=matchKits(m,L);
  const half=(rows,info,all,kit,side)=>{
    const lines=rows.map((r,k)=>`<div class="line">${r.map(p=>playerDot(p,info,all,kit,k===0)).join('')}</div>`);
    return `<div class="half">${(side==='away'?lines.reverse():lines).join('')}</div>`;
  };
  const ih=L.ih||{},ia=L.ia||{};
  return `<div class="pitch">${teamBar(m.h,L.fh,L.mh,hr,ih,kh)}<div class="field"><i class="mid"></i><i class="circle"></i><i class="box top"></i><i class="box bot"></i>${half(hr,ih,L.h,kh,'home')}${half(ar,ia,L.a,ka,'away')}</div>${teamBar(m.a,L.fa,L.ma,ar,ia,ka)}</div>`
    +(L.fh&&L.fa?'':'<p class="note" style="margin-top:8px;text-align:center">Đội chưa khai báo sơ đồ được xếp tự động theo nhóm vị trí, có thể khác đội hình chiến thuật thực tế.</p>');
}
function lineupBlock(m,L,H,A){
  const list=`<div class="cols">${H.st}${A.st}</div>`,pitch=pitchView(m,L);
  if(!pitch)return list;
  const btn=(v,t)=>`<button data-view="${v}" aria-pressed="${lineupView===v}">${t}</button>`;
  return `<div class="seg mini">${btn('pitch','Sơ đồ sân')}${btn('list','Danh sách')}</div><div data-pane="pitch" ${lineupView==='pitch'?'':'hidden'}>${pitch}</div><div data-pane="list" ${lineupView==='list'?'':'hidden'}>${list}</div>`;
}
ov.addEventListener('click',e=>{
  const b=e.target.closest('[data-view]');if(!b)return;
  lineupView=b.dataset.view;save('lineupView',lineupView);
  ov.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.view===lineupView));
  ov.querySelectorAll('[data-pane]').forEach(x=>x.hidden=x.dataset.pane!==lineupView);
});
function statRow(label,a,b,suffix=''){return `<div class="st"><span class="l">${a}${suffix}</span><span class="n">${label}</span><span class="r">${b}${suffix}</span></div>`}
const STATS=[['Kiểm soát bóng','%'],['Số cú sút',''],['Sút trúng đích',''],['Phạt góc',''],['Phạm lỗi',''],['Thẻ vàng','']];
function openMatch(i){
  const m=M[i],now=Date.now(),L=LINEUPS[m.h+'|'+m.a];
  const done=m.hs!==null,live=isLive(m,now),waiting=!done&&isOver(m,now);
  const mid=done?`${m.hs} - ${m.as}`:(live?'● ĐANG ĐÁ':'vs');
  const sub=done?'Đã kết thúc':live?'Đang diễn ra':waiting?'Chờ cập nhật kết quả':countdown(m.t,now);
  let body='';
  if(L){
    const H=teamCol(m.h,L.h),A=teamCol(m.a,L.a);
    body=`<h4>Đội hình ra sân</h4>${lineupBlock(m,L,H,A)}`;
    if(L.h.length>11||L.a.length>11)body+=`<h4>Cầu thủ dự bị (danh sách có thể chưa đầy đủ)</h4><div class="cols">${H.bn}${A.bn}</div>`;
    if(L.sh)body+=`<h4>Thống kê trận đấu</h4>`+STATS.map(([label,suf],k)=>L.sh[k]==null||L.sa[k]==null?'':statRow(label,L.sh[k],L.sa[k],suf)).join('');
    body+=L.url
      ?`<p class="note">Nguồn đội hình: <a href="${L.url}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(L.src)}</a>. ${L.fh&&L.fa?'':'Chưa đủ dữ liệu vị trí để xếp sơ đồ sân. '}Chưa có thống kê cho trận này.</p>`
      :`<p class="note">Dữ liệu chốt ngày ${UPDATED}. TM: thủ môn · HV: hậu vệ · TV: tiền vệ · TĐ: tiền đạo.</p>`;
  }else{
    const pub=m.t-60*60000;
    body=done||live||waiting
      ?`<div class="pend"><b>Chưa có dữ liệu đội hình cho trận này.</b><br>Bạn có thể nhắn Claude: "cập nhật đội hình ${esc(m.h)} – ${esc(m.a)}" để bổ sung vào trang nếu có dữ liệu.</div>`
      :`<div class="pend"><b>Đội hình chưa được công bố.</b><br>Thông thường các CLB công bố đội hình ra sân khoảng 60 phút trước giờ bóng lăn, tức khoảng <b>${fTime.format(pub)} ngày ${fDate.format(pub).replace(/^[^,]+,\s*/,'')}</b> (GMT+7).<br>Sau thời điểm đó, nhắn Claude "cập nhật đội hình ${esc(m.h)} – ${esc(m.a)}" để trang hiển thị đội hình mới.</div>`;
  }
  modal.innerHTML=`<div class="mh"><button class="x" id="closeM" aria-label="Đóng">✕</button>
    <div class="lgn">${LG[m.lg]}</div>
    <div class="teams"><b>${esc(m.h)}</b><span class="big">${mid}</span><b>${esc(m.a)}</b></div>
    <div class="sub">${fDate.format(m.t)} · ${fTime.format(m.t)} (GMT+7) · ${sub}</div></div><div class="mb">${body}</div>`;
  ov.classList.add('on');document.body.style.overflow='hidden';
}
function closeMatch(){ov.classList.remove('on');document.body.style.overflow=''}
list.addEventListener('click',e=>{const el=e.target.closest('.match');if(el)openMatch(+el.dataset.i)});
list.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('match')){e.preventDefault();openMatch(+e.target.dataset.i)}});
ov.addEventListener('click',e=>{if(e.target===ov||e.target.id==='closeM')closeMatch()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMatch()});
clubSearch.addEventListener('input',e=>{S.q=e.target.value;drawClubs()});

// ---- Đồng hồ & cập nhật tự động theo giờ thực
function tick(){
  const n=Date.now();
  clockTime.textContent=fSec.format(n);
  clockDate.textContent=fDate.format(n)+' · GMT+7';
  document.querySelectorAll('[data-cd]').forEach(el=>el.textContent=countdown(+el.dataset.cd,n));
}
setInterval(tick,1000);
// Mỗi phút: tự chuyển trận đã bắt đầu / kết thúc sang đúng mục và tính lại "trận tiếp theo"
setInterval(()=>{drawNext();drawList()},60000);
stamp.textContent=`Lịch & kết quả 6 giải châu Âu được cập nhật tự động; V.League và AFC Champions League Elite được nhập tay (AFC Elite chốt ngày 28/11/2026, từ lượt 5). Giờ đếm ngược, ngày/giờ trận và phân loại "sắp diễn ra / kết quả" luôn tự tính theo giờ thực tại Việt Nam.`;
document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.tab===S.tab));
drawAll();tick();
// ---- Tỷ số tự động (results.json do GitHub Actions tạo)
const API_ALIAS={'Como':['Como 1907'],'Angers':['Angers SCO'],'Racing Santander':['Santander','Real Racing Club de Santander'],'Rennes':['Stade Rennais'],'Werder Bremen':['Bremen','SV Werder Bremen'],'AEK Athens':['AEK','PAE AEK'],'Sabah':['Sabah FK'],'Shakhtar Donetsk':['Shakhtar','FK Shakhtar Donetsk'],'Man City':['Manchester City'],'Man United':['Manchester United'],'Nottm Forest':['Nottingham Forest','Nottingham'],'Brighton':['Brighton & Hove Albion','Brighton Hove'],'Newcastle':['Newcastle United'],'Tottenham':['Tottenham Hotspur'],'Leeds':['Leeds United'],'Ipswich':['Ipswich Town'],'Coventry':['Coventry City'],'Athletic Bilbao':['Athletic','Athletic Club'],'Atlético Madrid':['Atleti','Atlético de Madrid'],'Celta Vigo':['Celta','RC Celta de Vigo'],'Deportivo La Coruña':['Deportivo','RC Deportivo de La Coruña'],'Real Betis':['Real Betis Balompié'],'Real Sociedad':['Real Sociedad de Fútbol'],'Inter Milan':['Inter','Internazionale Milano'],'Bayern Munich':['Bayern','Bayern München'],'1. FC Köln':['Köln'],'Bayer Leverkusen':['Leverkusen','Bayer 04 Leverkusen'],"M'gladbach":['Borussia Mönchengladbach'],'Borussia Dortmund':['Dortmund'],'Hamburger SV':['HSV','Hamburg'],'VfB Stuttgart':['Stuttgart'],'Paris Saint-Germain':['PSG'],'Olympique Lyon':['Lyon','Olympique Lyonnais'],'Olympique Marseille':['Marseille','Olympique de Marseille'],'AS Monaco':['Monaco'],'RC Lens':['Lens','Racing Club de Lens'],'Lille OSC':['Lille'],'FC Porto':['Porto'],'Club Brugge':['Club Brugge KV'],'Sporting CP':['Sporting Clube de Portugal'],'Slavia Prague':['SK Slavia Praha'],'Slovan Bratislava':['ŠK Slovan Bratislava'],'LASK Linz':['LASK']};
const teamKey=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ø/gi,'o').toLowerCase().replace(/[^a-z0-9]+/g,' ').split(' ').filter(w=>w&&!['fc','cf','afc','ac','as','sc','ssc','us','rc','ud','cd','ca'].includes(w)).join(' ');
const sameTeam=(ours,api)=>{const k=[ours,...(API_ALIAS[ours]||[])].map(teamKey);return api.some(n=>k.includes(teamKey(n)))};
// Tìm tên đang dùng trên trang; CLB chưa có thì lấy tên ngắn của API
const localName=api=>[...clubs.keys()].find(c=>sameTeam(c,api))||api[1]||api[0];
function applyResults(list){
  for(const r of list){
    const t=Date.parse(r.utc);
    const near=M.filter(m=>m.lg===r.lg&&Math.abs(m.t-t)<45*864e5);
    let found=near.filter(m=>sameTeam(m.h,r.home)&&sameTeam(m.a,r.away));
    if(!found.length){
      const h=localName(r.home),a=localName(r.away);
      found=near.filter(m=>m.h===h&&m.a===a);
      if(!found.length){
        // Cùng giờ mà đã trùng một đội: nhiều khả năng lệch tên, không thêm để tránh trận bị lặp
        if(near.some(m=>Math.abs(m.t-t)<36*36e5&&(m.h===h||m.a===a))){console.warn('Chưa khớp tên đội:',r.lg,r.home[0],'-',r.away[0]);continue}
        const m={i:M.length,lg:r.lg,h,a,t,hs:null,as:null};
        M.push(m);found=[m];
        for(const c of [h,a]){if(!clubs.has(c))clubs.set(c,new Set());clubs.get(c).add(r.lg)}
      }
    }
    const m=found[0];
    m.t=t; // cập nhật nếu đổi giờ
    if(r.hs!=null){m.hs=r.hs;m.as=r.as}
  }
}
async function loadResults(){
  try{
    const res=await fetch('results.json',{cache:'no-store'});
    if(res.ok){applyResults(await res.json());drawAll()}
  }catch(e){console.warn('Không đọc được results.json',e)}
}
loadResults();setInterval(loadResults,5*60000);
</script>
